# ==============================================================================
# COMMON CONFIGURATION (Shared by ALL profiles)
# ==============================================================================
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc = "0.8.33"
evm_version = "paris"
ignored_error_codes = [2424]  # Suppress deprecated memory-safe-assembly natspec warning from forge-std
# Skip Safe 1.4.1 contracts (use FOUNDRY_PROFILE=safe to compile them with Solidity 0.7.6)
skip = ["lib/safe-smart-account/**", "script/safe/**"]
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./"}]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@safe/=lib/safe-smart-account/contracts/",
    "forge-std/=lib/forge-std/src/",
    "murky/=lib/murky/src/",
    "account/=src/account/",
    "implementation-whitelist/=src/implementation-whitelist/",
    "interfaces/=src/interfaces/",
    "libraries/=src/libraries/",
    "organization/=src/organization/",
    "script/=script/",
    "types/=src/types/"
]
# Lighter local default for stateful invariant testing. CI profile is stricter.
invariant = { runs = 32, depth = 100 }
# Skip scripts and tests when generating test coverage reports (only check source contract coverage)
no_match_coverage = "^(script|test)/.*"

# ------------------------------------------------------------------------------
# RPC ENDPOINTS (Network Aliases)
# Available to ALL profiles. Use via: --rpc-url mainnet
#
# Keyless public endpoints (from chainlist.org; mostly publicnode.com). The previous
# ankr.com public endpoints now require an API key, so they were replaced. For higher
# rate limits / reliability, point an alias at your own keyed provider, e.g.
# mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}".
# ------------------------------------------------------------------------------
[rpc_endpoints]
# Mainnets
mainnet = "https://ethereum-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"
optimism = "https://optimism-rpc.publicnode.com"
base = "https://base-rpc.publicnode.com"
ronin = "https://api.roninchain.com/rpc"

# Testnets
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
arbitrum-sepolia = "https://arbitrum-sepolia-rpc.publicnode.com"
base-sepolia = "https://base-sepolia-rpc.publicnode.com"
optimism-sepolia = "https://optimism-sepolia-rpc.publicnode.com"
local = "localhost:8545"

# Tenderly Virtual TestNets
#
# Example full RPC URL:
#   https://virtual.base.us-east.rpc.tenderly.co/<VNET_ID>
#
ethereum-fork = "https://virtual.mainnet.us-east.rpc.tenderly.co/${TENDERLY_ETHEREUM_FORK_VNET_ID}"
base-fork = "https://virtual.base.us-east.rpc.tenderly.co/${TENDERLY_BASE_FORK_VNET_ID}"
arbitrum-fork = "https://virtual.arbitrum.us-east.rpc.tenderly.co/${TENDERLY_ARBITRUM_FORK_VNET_ID}"
stage = "https://virtual.base.us-east.rpc.tenderly.co/${STAGE_TENDERLY_VIRTUAL_TESTNET_API_KEY}"

# ==============================================================================
# BLOCK EXPLORER VERIFICATION (Etherscan family)
# ==============================================================================
# Per-chain explorer config consumed by `forge verify-contract` / `forge script
# --verify` (and by `make verify` / `make verify-all`). With Etherscan V2 a single
# ETHERSCAN_API_KEY covers all of these chains; these entries just let forge resolve
# the key/URL automatically when you pass `--chain <name>` or a numeric chain id.
# Unset ${ETHERSCAN_API_KEY} interpolates to empty and is only an error if you
# actually verify — it does not affect build/test/script runs.
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = 10 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

# Template for an Etherscan-style explorer on a chain NOT in forge's built-in
# registry. The `chain` (numeric id) + `url` (verifier API endpoint) make it
# resolvable: forge matches this entry by that numeric id (or by a matching
# --rpc-url endpoint alias), since `--chain` itself only accepts built-in chain
# names or a raw chain id. Trigger it with `--chain <id>` or `forge script
# --rpc-url my_l2 --verify`.
# my_l2 = { key = "${MY_L2_API_KEY}", chain = 9999, url = "https://explorer.my-l2.xyz/api" }

# ==============================================================================
# CI PROFILE (For Continuous Integration)
# ==============================================================================
[profile.ci]
fuzz = { runs = 256  }
invariant = { runs = 256 }

# ==============================================================================
# SAFE 1.4.1 DEPLOYMENT PROFILE
# Uses Solidity 0.7.6 for deterministic Safe deployments matching official bytecode
# ==============================================================================
[profile.safe]
src = "script/safe"            # Only compile Safe deployment script and its dependencies
out = "out-safe"               # Separate output directory to avoid conflicts
libs = ["lib"]
test = "script/safe"           # No tests for Safe profile
cache_path = "cache-safe"      # Separate cache to avoid conflicts
solc = "0.7.6"                 # Safe 1.4.1 official compiler version
evm_version = "istanbul"       # Safe 1.4.1 was deployed targeting Istanbul
optimizer = false              # Official Safe deployments don't use optimizer
via_ir = false                 # Safe 1.4.1 was compiled without IR pipeline
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./"}]
# Skip 0.8.33 files that are incompatible with Solidity 0.7.6
skip = ["script/Deploy*.s.sol", "script/libraries/Array*.sol", "script/libraries/Linked*.sol", "test/**", "src/**"]
remappings = [
    "@safe/=lib/safe-smart-account/contracts/",
    "forge-std/=lib/forge-std/src/",
    "script/=script/"
]

# ==============================================================================
# LINTING CONFIGURATION
# ==============================================================================
[lint]
# Disable the asm-keccak256 lint - we prefer readable keccak256() calls over assembly
exclude_lints = ["asm-keccak256"]

# ==============================================================================
# FORMATTING CONFIGURATION
# ==============================================================================
[fmt]
int_types = "long"           # Enforces "uint256" over "uint" (Implicit in your examples)
line_length = 120
multiline_func_header = "attributes_first" 
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true
bracket_spacing = false      # Matches "No spaces inside brackets: arr[i]" 
sort_imports = true          # Enforces "Strictly alphabetize imports"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
