# ==============================================================================
# COMMON CONFIGURATION (Shared by ALL profiles)
# ==============================================================================
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc = "0.8.33"
evm_version = "paris"
ignored_error_codes = [2424]  # Suppress deprecated memory-safe-assembly natspec warning from forge-std
# Skip Safe 1.3.0 contracts (use FOUNDRY_PROFILE=safe to compile them with Solidity 0.7.6)
skip = ["lib/safe-smart-account/**", "script/safe/**"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./"}]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@safe/=lib/safe-smart-account/contracts/",
    "forge-std/=lib/forge-std/src/",
    "account/=src/account/",
    "implementation-whitelist/=src/implementation-whitelist/",
    "interfaces/=src/interfaces/",
    "libraries/=src/libraries/",
    "organization/=src/organization/",
    "script/=script/",
    "types/=src/types/"
]

# ------------------------------------------------------------------------------
# RPC ENDPOINTS (Network Aliases)
# Available to ALL profiles. Use via: --rpc-url mainnet
# ------------------------------------------------------------------------------
[rpc_endpoints]
# Mainnets
mainnet = "https://rpc.ankr.com/eth"
polygon = "https://rpc.ankr.com/polygon"
arbitrum = "https://rpc.ankr.com/arbitrum"
optimism = "https://rpc.ankr.com/optimism"
base = "https://rpc.ankr.com/base"

# Testnets
sepolia = "https://rpc.ankr.com/eth_sepolia"
arbitrum-sepolia = "https://rpc.ankr.com/arbitrum_sepolia"
base-sepolia = "https://rpc.ankr.com/base_sepolia"
optimism-sepolia = "https://rpc.ankr.com/optimism_sepolia"

# ==============================================================================
# CI PROFILE (For Continuous Integration)
# ==============================================================================
[profile.ci]
fuzz = { runs = 256  }
invariant = { runs = 256 }

# ==============================================================================
# SAFE 1.3.0 DEPLOYMENT PROFILE
# Uses Solidity 0.7.6 for deterministic Safe deployments matching official bytecode
# ==============================================================================
[profile.safe]
src = "script/safe"            # Only compile Safe deployment script and its dependencies
out = "out-safe"               # Separate output directory to avoid conflicts
libs = ["lib"]
test = "script/safe"           # No tests for Safe profile
cache_path = "cache-safe"      # Separate cache to avoid conflicts
solc = "0.7.6"                 # Safe 1.3.0 official compiler version
evm_version = "istanbul"       # Safe 1.3.0 was deployed targeting Istanbul
optimizer = true
optimizer_runs = 200
via_ir = false                 # Safe 1.3.0 was compiled without IR pipeline
fs_permissions = [{ access = "read-write", path = "./"}]
# Skip 0.8.33 files that are incompatible with Solidity 0.7.6
skip = ["script/Deploy*.s.sol", "script/libraries/Array*.sol", "script/libraries/Linked*.sol", "test/**", "src/**"]
remappings = [
    "@safe/=lib/safe-smart-account/contracts/",
    "forge-std/=lib/forge-std/src/",
    "script/=script/"
]

# ==============================================================================
# LINKING PROFILES (Compilation Strategies)
# These profiles inherit settings from [profile.default] but override libraries.
# ==============================================================================

