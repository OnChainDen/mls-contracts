# ==============================================================================
# SAFE MULTISIG CONFIGURATIONS
# ==============================================================================
# These are environment-dependent (prod vs non-prod), not factory-dependent.
# Used for Safe owner addresses, thresholds, and executor EOAs.
# ==============================================================================

# ------------------------------------------------------------------------------
# Non-Production Safe Configuration
# ------------------------------------------------------------------------------
# For local development and testnet deployments.
# Uses single-owner Safes for simplicity.
# ------------------------------------------------------------------------------
[safe.nonprod]
# Guardian Safe config (1-of-1)
guardian_safe_threshold = 1
guardian_safe_owner_1 = "0x22002e8661A780d61EF4c86F4a9fFa843A6fea20"

# Admin Safe config (1-of-1)
admin_safe_threshold = 1
admin_safe_owner_1 = "0x8DA06Ab9bBb0736d36c92E10B1d6e23A890FD32F"

# Guardian Executor EOA (authorized to execute via Guardian Safe module)
# For local/testnet testing, use the test-guardian-executor foundry account
