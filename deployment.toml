# ==============================================================================
# SAFE MULTISIG CONFIGURATIONS
# ==============================================================================
# These are environment-dependent (prod vs non-prod), not factory-dependent.
# Used for Safe owner addresses, thresholds, and executor EOAs.
# ==============================================================================

# ------------------------------------------------------------------------------
# Non-Production Safe Configuration
# ------------------------------------------------------------------------------
# For local development and testnet deployments.
# Uses single-owner Safes for simplicity.
# ------------------------------------------------------------------------------
[safe.nonprod]
# Guardian Safe config (1-of-1)
guardian_safe_threshold = 1
guardian_safe_owner_1 = "0x22002e8661A780d61EF4c86F4a9fFa843A6fea20"

# Deployer Safe config (1-of-1)
deployer_safe_threshold = 1
deployer_safe_owner_1 = "0x8DA06Ab9bBb0736d36c92E10B1d6e23A890FD32F"

# Safe Executor EOAs (authorized to execute via modules)
# For local/testnet testing, use the test-guardian-executor and test-deployer-executor foundry accounts
guardian_executor_eoa = "0x66FB51BF8C7a973a278578A2E381Fb5e89796DE1"
deployer_executor_eoa = "0xBd7DF30E88C5C7fD54F2Ac77a1302581d577E0Fd"

# ------------------------------------------------------------------------------
# Production Safe Configuration
# ------------------------------------------------------------------------------
# For mainnet deployments.
# Uses multi-owner Safes with 2-of-3 threshold.
# TODO: Update owner addresses before mainnet deployment.
# ------------------------------------------------------------------------------
[safe.prod]
# Guardian Safe config (2-of-3)
