# ==============================================================================
# Deployment Configuration
# ==============================================================================
# Single source of truth for all deterministic deployment addresses.
#
# [factory.*]         - Addresses that depend on which CREATE2 factory is used
# [factory.*.env.*]   - Environment-dependent addresses (prod vs nonprod Safe configs)
# [safe.*]            - Safe multisig configs (owners, thresholds, executor EOAs)
#
# IMPORTANT: When updating addresses, also update compute_all_addresses.sh
# to verify computed addresses match these values.
# ==============================================================================

# ==============================================================================
# FACTORY-DEPENDENT ADDRESSES
# ==============================================================================
# These addresses are computed using CREATE2 and differ based on which
# factory is used for deployment.
# ==============================================================================

