# ------------------------------------------------------------------------------
# Production Safe Configuration
# ------------------------------------------------------------------------------
# For mainnet deployments.
# Uses multi-owner Safes with 2-of-3 threshold.
# TODO: Update owner addresses before mainnet deployment.
